global
  log /dev/log local0
  maxconn 10000
  stats socket /run/dual-ha/haproxy.sock mode 660 level admin
defaults
  mode tcp
  log global
  option tcplog
  timeout connect 6s
  timeout client 10m
  timeout server 10m
  timeout check 3s
frontend local_socks
  bind 127.0.0.1:18080
  default_backend socks_egress
backend socks_egress
  balance leastconn
  option tcp-check
  server backhaul 127.0.0.1:21001 check inter 2s fall 3 rise 5
  server mieru 127.0.0.1:21002 check inter 2s fall 3 rise 5
