global
  log stdout format raw local0
  maxconn 20000
  stats socket /run/dual-ha-v2/haproxy.sock mode 600 level admin
defaults
  log global
  mode tcp
  option tcplog
  timeout connect 8s
  timeout client 2h
  timeout server 2h
  timeout check 3s
frontend iran_xray_local_outbound
  bind 127.0.0.1:18080
  default_backend dual_egress
backend dual_egress
  balance leastconn
  option tcp-check
  default-server inter 3s fall 2 rise 3
  server backhaul 127.0.0.1:21001 check disabled
  server mieru 127.0.0.1:21002 check disabled
