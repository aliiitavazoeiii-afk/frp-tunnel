name: triple-carrier-audit
on:
  push:
    branches: [triple-carrier-naive]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Production baseline audit
        run: |
          cd dual-trust-mieru
          bash source-audit.sh
      - name: Unified triple carrier audit
        run: |
          cd dual-trust-mieru
          bash lane3-source-audit.sh
