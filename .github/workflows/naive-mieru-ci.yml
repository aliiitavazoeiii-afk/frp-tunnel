name: Naive Mieru preproduction validation
on:
  push:
    branches: [naive-mieru-live-safe-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n dual-trust-mieru/nm-iran.sh dual-trust-mieru/nm-autoheal.sh dual-trust-mieru/nm-cli.sh dual-trust-mieru/nm-health.sh dual-trust-mieru/nm-retire-trust.sh dual-trust-mieru/install-foreign-lane3-naive.sh dual-trust-mieru/nm-rr-maintenance.sh dual-trust-mieru/nm-manager.sh dual-trust-mieru/nm-foreign-wizard.sh dual-trust-mieru/nm-install-manager.sh dual-trust-mieru/nm-adaptive-install.sh dual-trust-mieru/nm-naive-shards-maintenance.sh dual-trust-mieru/nm-fresh-iran.sh dual-trust-mieru/nm-fresh-attach-xui.sh dual-trust-mieru/nm-helper.sh dual-trust-mieru/nm-ha-install.sh dual-trust-mieru/nm-naive-inspect.sh
      - run: python3 -m py_compile dual-trust-mieru/nm-pool-balance.py dual-trust-mieru/nm-replace.py dual-trust-mieru/nm-stats.py dual-trust-mieru/nm-adaptive-core.py dual-trust-mieru/nm-adaptive-canary.py dual-trust-mieru/nm-adaptive-test.py dual-trust-mieru/nm-naive-fresh-client-diagnose.py dual-trust-mieru/nm-live-audit.py dual-trust-mieru/nm-live-audit-test.py dual-trust-mieru/nm-ha-agent.py dual-trust-mieru/nm-ha-telemetry.py dual-trust-mieru/nm-ha-test.py dual-trust-mieru/nm-naive-shards-compare.py dual-trust-mieru/nm-mieru-udp-diagnose.py dual-trust-mieru/nm-mieru-udp-diagnose-test.py dual-trust-mieru/nm-mieru-native-udp-canary.py dual-trust-mieru/nm-mieru-native-udp-canary-test.py dual-trust-mieru/nm-mieru-native-udp-cutover.py dual-trust-mieru/nm-app-paths-diagnose.py dual-trust-mieru/trust-fresh-client-diagnose.py dual-trust-mieru/trust-fresh-client-diagnose-test.py
      - run: test "$(grep -c 'allow xudp-trust.internal' dual-trust-mieru/install-foreign-lane3-naive.sh)" -eq 1
      - run: "! grep -Eq 'systemctl (stop|restart) (x-ui|dual-mieru-carrier|dual-xudp-bridge|dual-dispatcher)' dual-trust-mieru/nm-iran.sh"
      - run: "! grep -Eq 'systemctl (stop|restart|disable|enable) (x-ui|dual-mieru-carrier|dual-xudp-bridge|nm-naive-client)' dual-trust-mieru/nm-rr-maintenance.sh"
      - run: "! grep -Eq 'systemctl (stop|restart) (x-ui|dual-xudp-bridge|dual-dispatcher)' dual-trust-mieru/nm-manager.sh dual-trust-mieru/nm-foreign-wizard.sh dual-trust-mieru/nm-install-manager.sh"
      - run: python3 dual-trust-mieru/nm-adaptive-test.py -v
      - run: python3 dual-trust-mieru/nm-live-audit-test.py -v
      - run: python3 dual-trust-mieru/nm-ha-test.py -v
      - run: python3 dual-trust-mieru/trust-fresh-client-diagnose-test.py -v
      - run: python3 dual-trust-mieru/nm-mieru-udp-diagnose-test.py -v
      - run: python3 dual-trust-mieru/nm-mieru-native-udp-canary-test.py -v
      - run: "! grep -Eq 'systemctl (stop|restart|disable|enable) (x-ui|dual-mieru-carrier|dual-xudp-bridge|dual-dispatcher|nm-naive-client)' dual-trust-mieru/nm-adaptive-install.sh"
      - run: "! grep -Eq 'systemctl (stop|restart|disable|enable)|iptables|nft -f|killall|pkill' dual-trust-mieru/nm-naive-fresh-client-diagnose.py"
      - run: "! grep -Eq 'systemctl (stop|restart|disable|enable) (x-ui|dual-dispatcher|dual-xudp-bridge|dual-mieru-carrier)' dual-trust-mieru/nm-naive-shards-maintenance.sh"
      - name: Verify Mieru single-rule change and backup/rollback guard
        run: |
          python3 - <<'PY'
          import importlib.util,json,pathlib
          p=pathlib.Path("dual-trust-mieru/nm-mieru-native-udp-cutover.py")
          spec=importlib.util.spec_from_file_location("cutover",p)
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          data={"inbounds":[
             {"tag":"trust-in","listen":"127.0.0.1","port":7991,"protocol":"socks","settings":{"udp":True}},
             {"tag":"mieru-in","listen":"127.0.0.1","port":7992,"protocol":"socks","settings":{"udp":True}}],
            "outbounds":[
             {"tag":"xudp-trust","protocol":"vless"},
             {"tag":"xudp-mieru","protocol":"vless"},
             {"tag":"carrier-trust","protocol":"socks","settings":{"address":"127.0.0.1","port":7993}},
             {"tag":"carrier-mieru","protocol":"socks","settings":{"address":"127.0.0.1","port":7994}}],
            "routing":{"rules":[
             {"type":"field","inboundTag":["trust-in"],"network":"tcp","outboundTag":"carrier-trust"},
             {"type":"field","inboundTag":["trust-in"],"network":"udp","outboundTag":"xudp-trust"},
             {"type":"field","inboundTag":["mieru-in"],"network":"tcp","outboundTag":"carrier-mieru"},
             {"type":"field","inboundTag":["mieru-in"],"network":"udp","outboundTag":"xudp-mieru"}]}}
          assert m.known(data)=="xudp-mieru"
          out=json.loads(m.proposed(m.data_bytes(data)))
          assert m.known(out)=="carrier-mieru"
          out["routing"]["rules"][3]["outboundTag"]="xudp-mieru"
          assert out==data,"unexpected unrelated changes"
          src=p.read_text()
          for item in ("fcntl.flock", "FIX-MIERU-UDP","ROLLBACK-MIERU-UDP",
                       "atom(BACKUP,original)", "restart(original)", "test_xray(candidate)"):
              assert item in src,item
          print("Mieru native UDP single-rule change + cutover guards PASS")
          PY
      - name: Validate application-path diagnostic and DNS size tests
        run: |
          python3 - <<'PY'
          import importlib.util,pathlib,struct
          p=pathlib.Path("dual-trust-mieru/nm-app-paths-diagnose.py")
          spec=importlib.util.spec_from_file_location("diag",p)
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          qid,small=m.build_dns_query(0)
          _,big=m.build_dns_query(1200)
          assert len(small)<100
          assert len(big)==1200
          assert struct.unpack("!H",big[10:12])[0]==1
          assert 0<=qid<65536
          assert {x[0] for x in m.TARGETS}=={
              "TG_API","TG_WEB","YT_HOME","YT_IMAGE","IG_CONTROL"}
          src=p.read_text()
          for forbidden in ("systemctl restart","systemctl stop","systemctl reload",
                            "iptables","nft -f","/proxies/DUAL", "os.replace("):
              assert forbidden not in src,forbidden
          print("Read-only application path differential: PASS")
          PY
      - name: Check native Mieru Xray shadow doesn't write production
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path("dual-trust-mieru/nm-mieru-native-udp-canary.py").read_text()
          assert 'CANDIDATE_PORT=17992' in src
          assert 'candidate_configuration' in src
          assert 'carrier-mieru' in src
          assert 'subprocess.Popen' in src
          assert 'proc.terminate()' in src and 'proc.kill()' in src
          for forbidden in ('systemctl restart', 'systemctl stop', '/proxies/DUAL',
                            'iptables -', 'nft -f', 'os.replace(', 'shutil.copy('):
              assert forbidden not in src, forbidden
          print("Mieru UDP/native shadow read-only safe: PASS")
          PY
      - name: Verify Trust shadow does not write production or reveal credentials
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path("dual-trust-mieru/trust-fresh-client-diagnose.py").read_text()
          assert 'CANDIDATE_PORT=17983' in src
          assert 'candidate_config' in src
          assert 'proc.terminate()' in src and 'proc.kill()' in src
          for unsafe in ('systemctl restart','systemctl stop','systemctl reload',
                         '/proxies/DUAL', 'os.replace(', 'iptables', 'nft -f'):
              assert unsafe not in src,unsafe
          print("Trust read-only shadow source checks: PASS")
          PY
      - name: Verify Mieru diagnostics do not mutate live services
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path("dual-trust-mieru/nm-mieru-udp-diagnose.py").read_text()
          assert 'loopback_through_mieru' in src
          assert 'dns_check_reply' in src
          assert 'attempt_direct_udp' in src
          assert 'MIERU_XUDP' in src and 'NAIVE_XUDP' in src
          for forbidden in ('systemctl restart','systemctl stop','systemctl reload',
                            'PUT /proxies/DUAL','iptables','nft -f'):
              assert forbidden not in src
          print("Read-only Mieru UDP/XUDP diagnostics: PASS")
          PY
      - name: Verify Naive cutover false-negative recovery safety policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path("dual-trust-mieru/nm-naive-shards-maintenance.sh").read_text()
          assert 'probe_min 7993 10 8' in src
          assert 'probe_min 7991 8 6' in src
          assert 'health_retry' in src
          assert 'probe 17993 3' in src and 'probe 17994 3' in src
          assert 'ORIGINAL NAIVE CONFIG AND PROCESS RESTORED.' in src
          assert 'probe_min 7993 5 3' in src
          assert 'This does NOT mean configuration rollback failed.' in src
          assert 'verify_stage_matches_current' in src
          assert 'flock -w 20 8' in src
          print("Naive cutover multi-round postflight + accurate rollback reporting PASS")
          PY
      - name: Verify HA shard coordination and approved live cutover guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          agent=Path("dual-trust-mieru/nm-ha-agent.py").read_text()
          cut=Path("dual-trust-mieru/nm-naive-shards-maintenance.sh").read_text()
          assert "SHARD_AWARE_HA_V1" in agent
          assert "nm-naive-shard-a.service" in agent
          assert "nm-naive-shard-b.service" in agent
          assert "SHARD_RESTART_COOLDOWN=1800" in agent
          assert "sharding_live()" in agent
          assert "CUTOVER-NAIVE-SHARDS" in cut
          assert "grep -Fq 'SHARD_AWARE_HA_V1'" in cut
          assert "systemctl is-active --quiet nm-ha.timer" in cut
          assert 'nm-ha status' in cut
          print("Sharding-aware HA + interactive cutover guard PASS")
          PY
      - name: Verify Naive load isolation diagnostics do not touch production
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ab=Path("dual-trust-mieru/nm-naive-shards-compare.py").read_text()
          diag=Path("dual-trust-mieru/nm-naive-inspect.sh").read_text()
          sh=Path("dual-trust-mieru/nm-naive-shards-maintenance.sh").read_text()
          assert 'NAIVE_SINGLE' in ab and 'NAIVE_SHARDS_SHADOW' in ab
          assert 'nm-naive-shard-a' in ab and 'nm-naive-staging-gw' in ab
          assert 'run_one' in ab and 'MIERU_REFERENCE' in ab
          for src in (ab,diag):
              for forbidden in ('systemctl restart', 'systemctl stop', 'nft -f', 'iptables -'):
                  assert forbidden not in src, forbidden
          assert 'stage) stage' in sh and 'cutover) cutover' in sh
          assert 'flock -w 20 8' in sh
          print("Naive independent-shadow A/B diagnostic PASS")
          PY
      - name: Verify safe fast Naive outage differential helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script=Path("dual-trust-mieru/nm-naive-fresh-client-diagnose.py").read_text()
          manager=Path("dual-trust-mieru/nm-install-manager.sh").read_text()
          menu=Path("dual-trust-mieru/nm-helper.sh").read_text()
          assert 'parser.add_argument("--rounds"' in script
          assert 'parser.add_argument("--gap"' in script
          assert 'for n in range(1, args.rounds + 1)' in script
          assert "nm-naive-fresh-client-diagnose.py" in manager
          assert "nm-naive-shards-maintenance.sh" in manager
          assert "nm-naive-shards-compare.py" in manager
          assert "nm-naive-shards-compare --rounds 24" in menu
          assert 'STAGE-NAIVE' in menu
          assert "nm-naive-shards-maintenance.sh\" status" in menu
          replacement=Path("dual-trust-mieru/nm-replace.py").read_text()
          assert "Naive shards are live" in replacement
          assert "nm-naive-fresh-client-diagnose --rounds 8 --gap 2" in menu
          for forbidden in ("systemctl restart", "systemctl stop", "iptables", "killall", "nft -f"):
              assert forbidden not in script, forbidden
          print("Naive read-only outage differential: PASS")
          PY
      - name: Verify friendly Helper and SHA-pinned foreign wizard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path("dual-trust-mieru/nm-helper.sh").read_text()
          manager=Path("dual-trust-mieru/nm-install-manager.sh").read_text()
          wizard=Path("dual-trust-mieru/nm-foreign-wizard.sh").read_text()
          assert "nm-foreign-wizard.sh\" naive" in h
          assert "nm-foreign-wizard.sh\" mieru" in h
          assert "nm-live-audit --seconds 60" in h
          assert "nm-live-audit --seconds 300" in h
          assert "systemctl restart" not in h
          assert 'install -m 0755 "$B/nm-helper.sh"' in manager
          assert "git -C /opt/frp-tunnel-nm fetch --depth 1 origin" in wizard
          assert 'test "$(git -C /opt/frp-tunnel-nm rev-parse HEAD)" = "$SHA"' in wizard
          assert "systemctl restart x-ui" not in wizard
          print("Friendly Helper + pinned foreign replacement wizard: PASS")
          PY
      - name: Verify new live audit is GET-only and installed by manager
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path("dual-trust-mieru/nm-live-audit.py").read_text()
          manager=Path("dual-trust-mieru/nm-install-manager.sh").read_text()
          cli=Path("dual-trust-mieru/nm-cli.sh").read_text()
          menu=Path("dual-trust-mieru/nm-manager.sh").read_text()
          for forbidden in ("systemctl", "PUT", "POST", "DELETE", "iptables", "nft", "killall"):
              assert forbidden not in src, forbidden
          assert "nm-live-audit.py" in manager
          assert "  audit) shift;" in cli
          assert " 14) Live 60s" in menu
          print("READ-ONLY live audit and manager integration: PASS")
          PY
      - name: Verify fresh install renders and keeps x-ui untouched
        run: |
          python3 - <<'PY'
          import pathlib
          path=pathlib.Path("dual-trust-mieru/nm-fresh-iran.sh")
          src=path.read_text()
          lines=src.splitlines()
          starts=[i for i,line in enumerate(lines) if "<<'PY'" in line]
          assert len(starts)==2, f"expected 2 embedded Python scripts, got {len(starts)}"
          for i,start in enumerate(starts):
              end=lines.index("PY",start+1)
              compile(chr(10).join(lines[start+1:end]),f"embedded-{i}.py","exec")
          assert "systemctl restart x-ui" not in src
          assert "systemctl stop x-ui" not in src
          assert "install_trust_client" not in src
          assert "MULTIPLEXING_OFF" in src
          assert "lazy: false" in src
          assert "xudp-trust.internal" in src
          assert "Requires=nm-naive-client.service" not in src
          assert "Requires=dual-xudp-bridge.service" not in src
          print("Fresh Naive+Mieru installer: shell/python/safety invariants PASS")
          PY
      - name: Validate fresh XUI attach helper uses Naive+Mieru preflight
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("dual-trust-mieru/nm-fresh-attach-xui.sh").read_text()
          assert "for s in nm-naive-client dual-mieru-carrier dual-xudp-bridge dual-dispatcher" in s
          assert "dual-trust-client" not in s
          assert 'PROBE=/usr/local/sbin/nm-health' in s
          assert '"$PROBE" --full all' in s
          assert "systemctl stop x-ui" in s and "ROLLBACK: restoring x-ui DB" in s
          print("Fresh panel attach: safety and matching services PASS")
          PY
