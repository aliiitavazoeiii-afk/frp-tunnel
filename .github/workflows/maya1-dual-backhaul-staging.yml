name: Maya1 isolated dual Backhaul staging

on:
  push:
    branches: [dual-backhaul]
    paths:
      - 'dual-backhaul-mieru-ha/v2/maya1-stage-dual-backhaul.py'
      - 'dual-backhaul-mieru-ha/v2/maya1-foreign-fresh-poolguard.sh'
      - 'dual-backhaul-mieru-ha/v2/test_maya1_dual_stage.py'
      - 'dual-backhaul-mieru-ha/v2/maya1-safe-cutover.py'
      - 'dual-backhaul-mieru-ha/v2/maya1-emergency-persist-gateway.py'
      - 'dual-backhaul-mieru-ha/v2/maya1-emergency-refresh-helper.sh'
      - 'dual-backhaul-mieru-ha/v2/test_maya1_emergency_stabilize.py'
      - 'dual-backhaul-mieru-ha/v2/maya1-next-controller.py'
      - 'dual-backhaul-mieru-ha/v2/test_maya1_controller_bulk.py'
      - 'dual-backhaul-mieru-ha/v2/maya1-concurrency-canary.py'
      - 'dual-backhaul-mieru-ha/v2/test_maya1_concurrency_canary.py'
      - 'dual-backhaul-mieru-ha/v2/test_maya1_safe_cutover.py'
      - 'dual-backhaul-mieru-ha/v2/maya1-dual-helper.py'
      - 'dual-backhaul-mieru-ha/v2/install-maya1-helper.sh'
      - 'dual-backhaul-mieru-ha/v2/test_maya1_dual_helper.py'
      - 'dual-backhaul-mieru-ha/v2/maya1-quality-readonly-audit.py'
      - 'dual-backhaul-mieru-ha/v2/test_maya1_quality_audit.py'
      - '.github/workflows/maya1-dual-backhaul-staging.yml'
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and validate protected staging sources
        shell: bash
        run: |
          set -euo pipefail
          cd dual-backhaul-mieru-ha/v2
          python3 -m py_compile maya1-stage-dual-backhaul.py test_maya1_dual_stage.py
          bash -n maya1-foreign-fresh-poolguard.sh
          python3 test_maya1_dual_stage.py
          python3 -m py_compile maya1-safe-cutover.py maya1-next-controller.py test_maya1_safe_cutover.py
          python3 test_maya1_safe_cutover.py
          python3 -m py_compile test_maya1_controller_bulk.py
          python3 test_maya1_controller_bulk.py
          python3 -m py_compile maya1-concurrency-canary.py test_maya1_concurrency_canary.py
          python3 test_maya1_concurrency_canary.py
          python3 -m py_compile maya1-dual-helper.py test_maya1_dual_helper.py
          python3 test_maya1_dual_helper.py
          python3 -m py_compile maya1-emergency-persist-gateway.py test_maya1_emergency_stabilize.py
          python3 test_maya1_emergency_stabilize.py
          bash -n maya1-emergency-refresh-helper.sh
          bash -n install-maya1-helper.sh
          python3 -m py_compile maya1-quality-readonly-audit.py test_maya1_quality_audit.py
          python3 test_maya1_quality_audit.py
          grep -Fq 'EXACT_MAYA3_POOLGUARD_SHA256_VERIFIED' maya1-foreign-fresh-poolguard.sh
          grep -Fq 'connection_pool = 16' maya1-foreign-fresh-poolguard.sh
          grep -Fq 'tls_skip_verify = false' maya1-foreign-fresh-poolguard.sh
          grep -Fq -- '--resume-dante' maya1-foreign-fresh-poolguard.sh
          grep -Fq 'DANTE_PARTIAL_INSTALL_RECOVERED' maya1-foreign-fresh-poolguard.sh
          grep -Fq 'EXACT_MAYA3_POOLGUARD_SHA256_VERIFIED' maya1-foreign-fresh-poolguard.sh
