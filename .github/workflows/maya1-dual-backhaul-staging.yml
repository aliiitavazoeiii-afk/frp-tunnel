name: Maya1 isolated dual Backhaul staging

on:
  push:
    branches: [dual-backhaul]
    paths:
      - 'dual-backhaul-mieru-ha/v2/maya1-stage-dual-backhaul.py'
      - 'dual-backhaul-mieru-ha/v2/maya1-foreign-fresh-poolguard.sh'
      - 'dual-backhaul-mieru-ha/v2/test_maya1_dual_stage.py'
      - '.github/workflows/maya1-dual-backhaul-staging.yml'
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and validate protected staging sources
        shell: bash
        run: |
          set -euo pipefail
          cd dual-backhaul-mieru-ha/v2
          python3 -m py_compile maya1-stage-dual-backhaul.py test_maya1_dual_stage.py
          bash -n maya1-foreign-fresh-poolguard.sh
          python3 test_maya1_dual_stage.py
          grep -Fq 'EXACT_MAYA3_POOLGUARD_SHA256_VERIFIED' maya1-foreign-fresh-poolguard.sh
          grep -Fq 'connection_pool = 16' maya1-foreign-fresh-poolguard.sh
          grep -Fq 'tls_skip_verify = false' maya1-foreign-fresh-poolguard.sh
